name: Android CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 1.0.1). Vide = simple compilation, sans release."
        required: false
        type: string

# Une seule exécution à la fois par branche : une plus récente annule la précédente
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --ci

  apk:
    name: APK release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # créer la release et y déposer l'APK
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      INPUT_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      # Un tag vX.Y.Z (ou la saisie d'une version à la main) déclenche une release.
      # Le versionCode Android est calculé pour toujours augmenter : 1.2.3 → 10203.
      - name: Version
        id: version
        run: |
          tag=""
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; fi
          if [ -z "$tag" ] && [ -n "$INPUT_VERSION" ]; then tag="v${INPUT_VERSION#v}"; fi
          if [ -n "$tag" ]; then
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Version « $tag » invalide : le format attendu est vX.Y.Z (ex. v1.0.1)."
              exit 1
            fi
            number="${tag#v}"
            IFS=. read -r major minor patch <<< "$number"
            {
              echo "ORG_GRADLE_PROJECT_APPAINTUEUSE_VERSION_NAME=$number"
              echo "ORG_GRADLE_PROJECT_APPAINTUEUSE_VERSION_CODE=$((major * 10000 + minor * 100 + patch))"
            } >> "$GITHUB_ENV"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Clé de signature (si fournie)
        id: signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ORG_GRADLE_PROJECT_APPAINTUEUSE_STORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "ORG_GRADLE_PROJECT_APPAINTUEUSE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ORG_GRADLE_PROJECT_APPAINTUEUSE_KEY_ALIAS=$KEY_ALIAS"
              echo "ORG_GRADLE_PROJECT_APPAINTUEUSE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pas de clé de publication : l'APK sera signé avec la clé de debug."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compiler l'APK release
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --console=plain

      - name: Nommer l'APK
        id: apk
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if [ -n "$tag" ]; then
            name="appaintueuse-$tag.apk"
          else
            name="appaintueuse-ci-${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          {
            echo "### $name"
            echo "- Taille : $(du -h "$name" | cut -f1)"
            echo "- SHA-256 : \`$(sha256sum "$name" | cut -d' ' -f1)\`"
            echo "- Signature : $([ '${{ steps.signing.outputs.signed }}' = 'true' ] && echo 'clé de publication' || echo 'clé de debug (pas de secrets configurés)')"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      # Seulement avec la vraie clé de signature : une APK signée autrement ne pourrait pas
      # être installée par-dessus la version précédente.
      - name: Publier la release
        if: steps.version.outputs.tag != '' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          cat > notes.md <<EOF
          ## Appaintueuse ${TAG#v}

          ### Installer sur Android (7.0 ou plus)
          1. Depuis le téléphone, télécharger **$APK** (section *Assets* en bas de cette page).
          2. Ouvrir le fichier et autoriser l'installation depuis cette source si Android le demande.
          3. Lancer **Appaintueuse** : aucun compte ni connexion Internet nécessaire.

          > Android peut afficher un avertissement pour une application installée hors du Play Store : c'est normal.

          ### Vérification du fichier
          - SHA-256 : \`$SHA256\`
          - Compilé automatiquement par GitHub Actions et signé avec la clé de publication du projet.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Appaintueuse ${TAG#v}" --notes-file notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Appaintueuse ${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" "$APK" --clobber
